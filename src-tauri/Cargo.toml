[package]
name = "lalos-pos"
version = "0.2.3"
description = "Lalo's Burgas — Caja, comandera, cocina y administración del menú"
authors = ["Lalo's Burgas"]
edition = "2021"
rust-version = "1.77"

[lib]
# Nombre distinto al binario para evitar choques en Windows
name = "lalos_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite embebido (no requiere instalar nada en la PC de la caja)
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTP hacia Supabase (TLS en Rust puro, sin OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Sesión guardada en el Administrador de credenciales de Windows
keyring = { version = "3", features = ["windows-native"] }
# Impresoras por puerto COM
serialport = "4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
# Actualizaciones automáticas del POS (desde GitHub Releases)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
